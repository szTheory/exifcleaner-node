name: Performance P95 Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: diagnostic (${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: "${{ github.sha }}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 411fdbdad3faa2e5dd5033bea5def435b4d03323
          path: .benchmark-baseline
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:native
      - name: Pack immutable v0.1.1 baseline
        working-directory: .benchmark-baseline
        run: npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE"
      - name: Pack freshly built candidate
        run: npm pack --json > pack.json
      - name: Run the frozen seven-fixture diagnostic profile once
        shell: bash
        run: |
          baseline="$(find . -maxdepth 1 -name 'exifcleaner-node-0.1.1.tgz' -print -quit)"
          candidate="$(node -p "require('./pack.json')[0].filename")"
          test -n "$baseline" && test -n "$candidate"
          npm run benchmark:qualify -- --baseline-tarball "$baseline" --candidate-tarball "$candidate" --profile phase-46-performance-p95-diagnostic/v1 --mode report --output "qualification-benchmark-node-${{ matrix.node }}.json"
          node scripts/qualification/benchmark-report.cjs --validate-diagnostic-report "qualification-benchmark-node-${{ matrix.node }}.json"
      - name: Hash the diagnostic report and summary
        shell: bash
        run: |
          sha256sum "qualification-benchmark-node-${{ matrix.node }}.json" > "qualification-benchmark-node-${{ matrix.node }}.json.sha256"
          sha256sum "qualification-benchmark-node-${{ matrix.node }}.json.md" > "qualification-benchmark-node-${{ matrix.node }}.json.md.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-p95-diagnostic-node-${{ matrix.node }}
          path: |
            qualification-benchmark-node-${{ matrix.node }}.json
            qualification-benchmark-node-${{ matrix.node }}.json.md
            qualification-benchmark-node-${{ matrix.node }}.json.sha256
            qualification-benchmark-node-${{ matrix.node }}.json.md.sha256
          if-no-files-found: error

  envelope:
    name: seal diagnostic-only envelope
    needs: diagnostic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: "${{ github.sha }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: performance-p95-diagnostic-node-*
          path: diagnostic
          merge-multiple: false
      - name: Bind exactly the two diagnostic-only Node reports
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { validatePerformanceP95DiagnosticReport } = require('./scripts/qualification/benchmark-report.cjs');
          const majors = [22, 24];
          const dirs = fs.readdirSync('diagnostic').sort();
          if (JSON.stringify(dirs) !== JSON.stringify(majors.map((major) => `performance-p95-diagnostic-node-${major}`)))
            throw new Error('diagnostic artifact upload set is not exact');
          const reports = {};
          for (const major of majors) {
            const dir = path.join('diagnostic', `performance-p95-diagnostic-node-${major}`);
            const report = JSON.parse(fs.readFileSync(path.join(dir, `qualification-benchmark-node-${major}.json`), 'utf8'));
            validatePerformanceP95DiagnosticReport(report);
            reports[`node${major}`] = report;
          }
          fs.writeFileSync(
            'performance-p95-diagnostic-envelope.json',
            `${JSON.stringify({ schemaVersion: 'phase-46-performance-p95-diagnostic-envelope/v1', diagnosticOnly: true, reports }, null, 2)}\n`,
          );
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-p95-diagnostic-envelope
          path: performance-p95-diagnostic-envelope.json
          if-no-files-found: error
