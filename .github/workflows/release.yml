name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Audit and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:cycles
      - run: npm run build
      - run: npm run check:dist
      - name: Validate release version and exact tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: node scripts/release_guard.cjs
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Pack and exercise the release artifact
        id: pack
        run: node scripts/package_smoke.cjs --keep
      - name: Generate checksum and CycloneDX SBOM
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tarball_dir="$(dirname -- "${TARBALL}")"
          tarball_name="$(basename -- "${TARBALL}")"
          (cd "${tarball_dir}" && sha256sum "${tarball_name}") > SHA256SUMS
          npm sbom --sbom-format cyclonedx > package.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ steps.pack.outputs.version }}
          path: |
            *.tgz
            SHA256SUMS
            package.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest package and SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.tgz
            SHA256SUMS
            package.cdx.json
      - name: Trusted publish to npm
        if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "${TARBALL}" --access public
      - name: Dry-run publish
        if: ${{ github.event_name != 'push' || vars.NPM_PUBLISH_ENABLED != 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "${TARBALL}" --access public --dry-run
      - name: Refuse an unarmed tag release
        if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED != 'true' }}
        run: |
          echo "::error::Set the repository variable NPM_PUBLISH_ENABLED=true only after configuring npm trusted publishing and the protected npm environment."
          exit 1
