name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Audit and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:cycles
      - run: npm run build
      - name: Validate release version and exact tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: node scripts/release_guard.cjs
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Pack and exercise the release artifact
        id: pack
        run: node scripts/package_smoke.cjs --keep
      - name: Generate checksum and CycloneDX SBOM
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tarball_dir="$(dirname -- "${TARBALL}")"
          tarball_name="$(basename -- "${TARBALL}")"
          (cd "${tarball_dir}" && sha256sum "${tarball_name}") > SHA256SUMS
          npm sbom --sbom-format cyclonedx > package.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ steps.pack.outputs.version }}
          path: |
            *.tgz
            SHA256SUMS
            package.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest package and SBOM provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            *.tgz
            SHA256SUMS
            package.cdx.json
      - name: Trusted publish to npm
        if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "${TARBALL}" --access public
      - name: Dry-run publish
        if: ${{ github.event_name != 'push' || vars.NPM_PUBLISH_ENABLED != 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "${TARBALL}" --access public --dry-run
      - name: Refuse an unarmed tag release
        if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED != 'true' }}
        run: |
          echo "::error::Set the repository variable NPM_PUBLISH_ENABLED=true only after configuring npm trusted publishing and the protected npm environment."
          exit 1
