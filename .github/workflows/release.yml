name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-admission:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  immutable-sha-evidence:
    needs: [native-admission]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - name: Verify immutable implementation evidence
        run: node -e "const e=require('./admitted/admission.json'); if(e.implementationSha !== process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('implementationSha tarballSha256 admission.json mismatch')"

  installed-linux-x64:
    needs: [native-admission]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - run: node -e "const e=require('./admitted/admission.json'), x=e.tuples['linux-x64']; if(!x || x.implementationSha!==process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('admission.json linux-x64 implementationSha tarballSha256')"
  installed-linux-arm64:
    needs: [native-admission]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - run: node -e "const e=require('./admitted/admission.json'), x=e.tuples['linux-arm64']; if(!x || x.implementationSha!==process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('admission.json linux-arm64 implementationSha tarballSha256')"
  installed-darwin-x64:
    needs: [native-admission]
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - run: node -e "const e=require('./admitted/admission.json'), x=e.tuples['darwin-x64']; if(!x || x.implementationSha!==process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('admission.json darwin-x64 implementationSha tarballSha256')"
  installed-darwin-arm64:
    needs: [native-admission]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - run: node -e "const e=require('./admitted/admission.json'), x=e.tuples['darwin-arm64']; if(!x || x.implementationSha!==process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('admission.json darwin-arm64 implementationSha tarballSha256')"
  installed-win32-x64:
    needs: [native-admission]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - run: node -e "const e=require('./admitted/admission.json'), x=e.tuples['win32-x64']; if(!x || x.implementationSha!==process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('admission.json win32-x64 implementationSha tarballSha256')"
  installed-win32-arm64:
    needs: [native-admission]
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: admitted
      - run: node -e "const e=require('./admitted/admission.json'), x=e.tuples['win32-arm64']; if(!x || x.implementationSha!==process.env.GITHUB_SHA || !e.tarballSha256) throw new Error('admission.json win32-arm64 implementationSha tarballSha256')"

  release:
    name: Audit and publish admitted tarball
    needs:
      [
        immutable-sha-evidence,
        installed-linux-x64,
        installed-linux-arm64,
        installed-darwin-x64,
        installed-darwin-arm64,
        installed-win32-x64,
        installed-win32-arm64,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release version and exact tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: node scripts/release_guard.cjs
      - run: npm audit --omit=dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admitted-native-tarball
          path: admitted
      - name: Verify admitted tarball checksum and final evidence
        run: cd admitted && sha256sum -c tarball.sha256 && test -n "$(find . -name '*.tgz' -print -quit)"
      - name: Generate checksum and CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > package.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: admitted/*.tgz
      # NHY-02/D-06a: the release attestation is the only authority under Policy A
      # (no prebuild is committed). Inverting the tampered-copy verify turns an
      # always-pass verifier into a red release job, and this runs only at
      # release time, so it costs no per-PR minutes.
      - name: Verify provenance and reject a tampered tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="$(find admitted -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          cp "$tarball" tampered.tgz
          node -e "const fs=require('fs');const f=process.argv[1];const b=fs.readFileSync(f);b[b.length-1]^=0xff;fs.writeFileSync(f,b)" tampered.tgz
          if gh attestation verify tampered.tgz --repo "$GITHUB_REPOSITORY"; then
            echo "tampered tarball passed attestation verification" >&2
            exit 1
          fi
          rm -f tampered.tgz
      - name: Trusted publish to npm
        if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm publish ./admitted/*.tgz --access public
      - name: Dry-run publish
        if: ${{ github.event_name != 'push' || vars.NPM_PUBLISH_ENABLED != 'true' }}
        run: npm publish ./admitted/*.tgz --access public --dry-run
      - name: Refuse an unarmed tag release
        if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED != 'true' }}
        run: exit 1
