name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI scope classification (D-15 to D-18, D-20). A run stays "linux" only when
  # scripts/classify_ci_scope.cjs positively proves every changed path is
  # Linux-only-safe; every gate below reads `!= 'linux'` / `== 'linux' ||` with
  # `!cancelled()`, so a classify failure (empty outputs) runs the full matrix
  # (fail-closed at the graph level, per GitHub's required-status-check docs).
  # Measured (run 35426479626): a skipped matrix job reports its unexpanded
  # name, e.g. `build-audit-${{ matrix.tuple }}`, which would leave the 14
  # matrix-expanded required contexts pending forever -- so the three matrix
  # jobs below run a no-op leg on ubuntu instead of skipping (Task 2 option-a).
  classify:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: scope
        name: Classify CI scope (fail-closed)
        env:
          CLASSIFY_EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_WORKFLOW: ${{ github.workflow }}
          CLASSIFY_REF: ${{ github.ref }}
          CLASSIFY_BEFORE: ${{ github.event.before }}
          CLASSIFY_FORCED: ${{ github.event.forced }}
          CLASSIFY_HEAD: ${{ github.sha }}
        run: node scripts/classify_ci_scope.cjs

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run check:cycles && npm run build && npm run build:native && npm test && npm run check:runtime && npm run check:release

  qualification-linux:
    needs: quality
    runs-on: ubuntu-24.04
    env:
      FC_SEED: "460046"
      FC_RUNS: "200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:native
      - name: Admit committed offline oracle authority
        run: node scripts/qualification/build-oracles.cjs --verify-authority > oracle-authority.json
      - name: Run complete property, transaction, and external-oracle corpus
        run: npm test -- tests/qualification/kit/floors.test.ts tests/qualification/kit/oracles.test.ts tests/qualification/webp/tracer.test.ts tests/qualification/webp/parser.test.ts tests/qualification/webp/property.test.ts tests/qualification/webp/transaction.test.ts tests/qualification/webp/oracles.test.ts tests/qualification/webp/golden.test.ts
      - name: Record focused qualification conclusion
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'); const crypto=require('node:crypto'); const readAuthority=name=>{const raw=process.env[name];if(typeof raw!=='string')throw new Error(`focused ${name} authority is absent`);if(!/^[1-9][0-9]*$/u.test(raw))throw new Error(`focused ${name} authority is not a positive decimal integer`);const value=Number(raw);if(!Number.isSafeInteger(value))throw new Error(`focused ${name} authority is not a safe integer`);return value;};const seed=readAuthority('FC_SEED');const propertyRuns=readAuthority('FC_RUNS'); const manifest=fs.readFileSync('tests/corpus/manifest.json'); const authority=fs.existsSync('oracle-authority.json')?JSON.parse(fs.readFileSync('oracle-authority.json','utf8')):null; fs.writeFileSync('qualification-linux.json',JSON.stringify({version:1,tuple:`${process.platform}-${process.arch}`,nodeVersion:process.version,seed,propertyRuns,manifestSha256:crypto.createHash('sha256').update(manifest).digest('hex'),authority},null,2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-linux-x64-node24
          path: qualification-linux.json
          if-no-files-found: error

  identity-prebuild:
    # phase-46-final-candidate/v1
    # The final manifest is deliberately absent during the 46-18 repair proof.
    # When Plan 46-11 adds it, this single shared validator fails closed before
    # any matching-host native compiler can run.
    needs: [quality, classify]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.classify.outputs.scope != 'linux' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enforce dormant final-candidate identity gate
        shell: bash
        run: |
          set -euo pipefail
          if test -f native/phase-46-final-candidate.json; then
            additions="$(git log --diff-filter=A --format=%H -- native/phase-46-final-candidate.json)"
            test "$(printf '%s\n' "$additions" | wc -l | tr -d ' ')" = "1"
            candidate="$(printf '%s\n' "$additions" | tail -1)"
            printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'
            git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"
            test "$(git rev-parse "$GITHUB_SHA:native/phase-46-final-candidate.json")" = "$(git rev-parse "$candidate:native/phase-46-final-candidate.json")"
            node scripts/qualification/benchmark-report.cjs --validate-final-candidate-manifest . "$candidate" "$(git rev-parse "$candidate^")"
          else
            printf '%s\n' 'phase-46 final-candidate manifest absent: repair-proof mode'
          fi

  build-audit-native:
    name: build-audit-${{ matrix.tuple }}
    needs: [identity-prebuild, classify]
    if: ${{ !cancelled() && (needs.classify.outputs.scope == 'linux' || needs.identity-prebuild.result == 'success') }}
    runs-on: ${{ needs.classify.outputs.scope == 'linux' && 'ubuntu-24.04' || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, tuple: linux-x64, os: linux, arch: x64 }
          - {
              runner: ubuntu-24.04-arm,
              tuple: linux-arm64,
              os: linux,
              arch: arm64,
            }
          - { runner: macos-15-intel, tuple: darwin-x64, os: darwin, arch: x64 }
          - { runner: macos-15, tuple: darwin-arm64, os: darwin, arch: arm64 }
          - { runner: windows-2025, tuple: win32-x64, os: win32, arch: x64 }
          - {
              runner: windows-11-arm,
              tuple: win32-arm64,
              os: win32,
              arch: arm64,
            }
    steps:
      - name: Record scope-skipped leg
        if: ${{ needs.classify.outputs.scope == 'linux' }}
        run: echo "scope=linux - this change cannot affect the native matrix; leg intentionally empty (docs/ci-budget.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          ref: "${{ github.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ needs.classify.outputs.scope != 'linux' }}
      - name: Assert matching runner and submitted SHA
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        shell: bash
        run: |
          test "$(node -p process.platform)" = "${{ matrix.os }}"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: npm run build && npm run build:native
        if: ${{ needs.classify.outputs.scope != 'linux' }}
      - name: Audit the exact compiled binary
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        shell: bash
        run: |
          node scripts/audit_native_artifact.cjs "prebuilds/${{ matrix.tuple }}/publication.node" > "${{ matrix.tuple }}.json"
          sha256sum "prebuilds/${{ matrix.tuple }}/publication.node" > "${{ matrix.tuple }}.binary.sha256"
          sha256sum "${{ matrix.tuple }}.json" > "${{ matrix.tuple }}.report.sha256"
          printf '%s\n' '${{ github.sha }}' > implementation.sha
          printf '%s\n' '${{ matrix.tuple }}' > tuple.txt
      - name: Test unchanged artifact on Node 22
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        env:
          WINDOWS_PUBLICATION_DIAGNOSTIC_PATH: windows-publication-matching-host-${{ matrix.tuple }}.json
        run: npm test -- tests/native_publication.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'win32' && needs.classify.outputs.scope != 'linux'
        with:
          name: windows-publication-matching-host-${{ matrix.tuple }}
          path: windows-publication-matching-host-${{ matrix.tuple }}.json
          if-no-files-found: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          node-version: 24
          cache: npm
      - name: Test unchanged artifact on Node 24
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        run: npm test -- tests/native_publication.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          name: native-${{ matrix.tuple }}
          path: |
            prebuilds/${{ matrix.tuple }}/publication.node
            ${{ matrix.tuple }}.json
            ${{ matrix.tuple }}.binary.sha256
            ${{ matrix.tuple }}.report.sha256
            implementation.sha
            tuple.txt
          if-no-files-found: error

  assemble-exact-native:
    needs: [build-audit-native, classify]
    if: ${{ !cancelled() && needs.classify.outputs.scope != 'linux' && needs.build-audit-native.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      implementation-sha: ${{ steps.identity.outputs.sha }}
      tarball-sha256: ${{ steps.identity.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: .native-input
          merge-multiple: false
      - name: Reject non-exact, stale, duplicate, fixture, or foreign input
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs'); const path = require('node:path'); const crypto = require('node:crypto');
          (async () => {
            const tuples = ['linux-x64','linux-arm64','darwin-x64','darwin-arm64','win32-x64','win32-arm64']; const sha = process.env.GITHUB_SHA;
            const inputRoot = '.native-input'; const assemblyRoot = '.native-assembly'; const dirs = fs.readdirSync(inputRoot).sort(); if (dirs.join(',') !== tuples.map(t => `native-${t}`).sort().join(',')) throw new Error('artifact upload set is not exact');
            fs.mkdirSync('.native-reports'); for (const tuple of tuples) { const dir = path.join(inputRoot, `native-${tuple}`); if (fs.readFileSync(path.join(dir,'tuple.txt'),'utf8').trim() !== tuple || fs.readFileSync(path.join(dir,'implementation.sha'),'utf8').trim() !== sha) throw new Error(`identity mismatch for ${tuple}`); const bin=path.join(dir,'prebuilds',tuple,'publication.node'); const report=path.join(dir,`${tuple}.json`); for (const [file,sum] of [[bin,`${tuple}.binary.sha256`],[report,`${tuple}.report.sha256`]]) { const expected=fs.readFileSync(path.join(dir,sum),'utf8').trim().split(/\s+/)[0]; const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'); if (expected !== actual) throw new Error(`stale ${sum}`); } fs.mkdirSync(path.join(assemblyRoot,'prebuilds',tuple),{recursive:true}); fs.copyFileSync(bin,path.join(assemblyRoot,'prebuilds',tuple,'publication.node')); fs.copyFileSync(report,path.join('.native-reports',`${tuple}.json`)); }
            const artifacts=require('./scripts/native_artifacts.cjs'); const reports=Object.fromEntries(tuples.map(t=>[t,fs.readFileSync(`.native-reports/${t}.json`,'utf8')])); const manifest=await artifacts.createManifest(assemblyRoot,reports); fs.writeFileSync('native-manifest.json',JSON.stringify(manifest,null,2));
            fs.rmSync(inputRoot, { recursive: true, force: true });
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          node scripts/runtime_surface_gate.mjs --assembly-root .native-assembly --manifest native-manifest.json --reports-dir .native-reports --evidence-scope final-release
          node - <<'NODE'
          const fs=require('node:fs'); const path=require('node:path'); const tuples=['linux-x64','linux-arm64','darwin-x64','darwin-arm64','win32-x64','win32-arm64']; fs.rmSync('prebuilds',{recursive:true,force:true}); for(const tuple of tuples){const target=path.join('prebuilds',tuple); fs.mkdirSync(target,{recursive:true}); fs.copyFileSync(path.join('.native-assembly',target,'publication.node'),path.join(target,'publication.node'));}
          NODE
      - name: Reject a Windows prebuild that names its N-API provider at link time
        shell: bash
        run: node scripts/check_windows_host_independence.cjs .
      - name: Pack exactly the admitted bytes
        shell: bash
        run: |
          npm pack --json > pack.json
          tarball="$(node -p "require('./pack.json')[0].filename")"
          tar -tf "$tarball" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.stringify(d.trim().split(/\\r?\\n/).map(p=>p.replace(/^package\\//,'')))))" > packed-listing.json
          node scripts/runtime_surface_gate.mjs --packed-listing packed-listing.json
          sha256sum "$tarball" > tarball.sha256
      - id: identity
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$(cut -d' ' -f1 tarball.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admitted-native-tarball
          path: |
            *.tgz
            tarball.sha256
            native-manifest.json
          if-no-files-found: error

  installed-native:
    name: installed-${{ matrix.tuple }}
    needs: [assemble-exact-native, classify]
    if: ${{ !cancelled() && (needs.classify.outputs.scope == 'linux' || needs.assemble-exact-native.result == 'success') }}
    runs-on: ${{ needs.classify.outputs.scope == 'linux' && 'ubuntu-24.04' || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, tuple: linux-x64, os: linux, arch: x64 }
          - {
              runner: ubuntu-24.04-arm,
              tuple: linux-arm64,
              os: linux,
              arch: arm64,
            }
          - { runner: macos-15-intel, tuple: darwin-x64, os: darwin, arch: x64 }
          - { runner: macos-15, tuple: darwin-arm64, os: darwin, arch: arm64 }
          - { runner: windows-2025, tuple: win32-x64, os: win32, arch: x64 }
          - {
              runner: windows-11-arm,
              tuple: win32-arm64,
              os: win32,
              arch: arm64,
            }
    steps:
      - name: Record scope-skipped leg
        if: ${{ needs.classify.outputs.scope == 'linux' }}
        run: echo "scope=linux - this change cannot affect the native matrix; leg intentionally empty (docs/ci-budget.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          ref: "${{ github.sha }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          name: admitted-native-tarball
          path: admitted
      - name: Verify submitted implementation and unchanged tarball
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.assemble-exact-native.outputs.implementation-sha }}"
          test "$(node -p process.platform)" = "${{ matrix.os }}"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          cd admitted && sha256sum -c tarball.sha256
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          node-version: 22
      - name: Smoke unchanged admitted tarball on Node 22
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        shell: bash
        run: |
          manifest_sha="$(node -e "const fs=require('node:fs'),c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync('tests/corpus/manifest.json')).digest('hex'))")"
          QUALIFICATION_PROPERTY_RUNS=25 node scripts/package_smoke.cjs --tarball "$(find admitted -name '*.tgz' -print -quit)" --tarball-sha256 "${{ needs.assemble-exact-native.outputs.tarball-sha256 }}" --manifest-sha256 "$manifest_sha" --evidence-scope final-matching-host --windows-publication-diagnostic-output "windows-publication-installed-node22-${{ matrix.tuple }}.json" --windows-cancellation-diagnostic-output "windows-cancellation-installed-node22-${{ matrix.tuple }}.json" > node-22.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'win32' && needs.classify.outputs.scope != 'linux'
        with:
          name: windows-publication-installed-node22-${{ matrix.tuple }}
          path: windows-publication-installed-node22-${{ matrix.tuple }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'win32' && needs.classify.outputs.scope != 'linux'
        with:
          name: windows-cancellation-installed-node22-${{ matrix.tuple }}
          path: windows-cancellation-installed-node22-${{ matrix.tuple }}.json
          if-no-files-found: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          node-version: 24
      - name: Smoke unchanged admitted tarball on Node 24
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        shell: bash
        run: |
          manifest_sha="$(node -e "const fs=require('node:fs'),c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync('tests/corpus/manifest.json')).digest('hex'))")"
          QUALIFICATION_PROPERTY_RUNS=25 node scripts/package_smoke.cjs --tarball "$(find admitted -name '*.tgz' -print -quit)" --tarball-sha256 "${{ needs.assemble-exact-native.outputs.tarball-sha256 }}" --manifest-sha256 "$manifest_sha" --evidence-scope final-matching-host > node-24.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          name: "installed-${{ matrix.tuple }}"
          path: node-*.json
          if-no-files-found: error

  immutable-sha-evidence:
    needs: [installed-native, classify]
    if: ${{ !cancelled() && needs.classify.outputs.scope != 'linux' && needs.installed-native.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installed-*
          path: installed
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admitted-native-tarball
          path: admitted
      - name: Record exact final admission evidence
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto'); const {CANONICAL_NATIVE_TUPLES:tuples,validateExactNativeManifestTuples}=require('./scripts/release_workflow_gate.cjs'); const {validateIdentityCleanupLedger}=require('./scripts/qualification/benchmark-report.cjs'); const tarballSha256=fs.readFileSync('admitted/tarball.sha256','utf8').trim().split(/\s+/)[0]; const manifest=JSON.parse(fs.readFileSync('admitted/native-manifest.json','utf8')); const manifestSha256=crypto.createHash('sha256').update(fs.readFileSync('tests/corpus/manifest.json')).digest('hex'); const nativeManifestSha256=crypto.createHash('sha256').update(fs.readFileSync('admitted/native-manifest.json')).digest('hex'); const byTuple=validateExactNativeManifestTuples(manifest); const candidate={implementationSha:process.env.GITHUB_SHA,tarballSha256,corpusManifestSha256:manifestSha256,nativeManifestSha256}; const ledger={schemaVersion:'phase-46-identity-cleanup-ledger/v1',run:{id:Number(process.env.GITHUB_RUN_ID),url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,ref:process.env.GITHUB_REF_NAME,headSha:process.env.GITHUB_SHA},candidate,artifacts:{},installed:{}};
          const installedDirs=fs.readdirSync('installed').sort(); if(installedDirs.join(',')!==tuples.map(tuple=>`installed-${tuple}`).sort().join(','))throw new Error('installed artifact upload set is not exact');
          for(const tuple of tuples){const dir=path.join('installed',`installed-${tuple}`); const files=fs.readdirSync(dir).sort(); if(JSON.stringify(files)!==JSON.stringify(['node-22.json','node-24.json']))throw new Error(`installed artifact file set is not exact for ${tuple}`); const reports=Object.fromEntries(files.map(file=>{const report=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8')); const nodeMajor=Number(file.match(/^node-(22|24)\.json$/)?.[1]); if(!nodeMajor)throw new Error(`installed report name is invalid for ${tuple}`); return [`node${nodeMajor}`,report];})); const record=byTuple.get(tuple); if(!record)throw new Error(`native manifest is incomplete for ${tuple}`); ledger.artifacts[tuple]={binarySha256:record.sha256,auditReportSha256:record.auditReportSha256,implementationSha:process.env.GITHUB_SHA}; ledger.installed[tuple]=reports;}
          validateIdentityCleanupLedger(ledger); fs.writeFileSync('identity-cleanup-ledger.json',JSON.stringify(ledger,null,2)); fs.writeFileSync('admission.json',JSON.stringify({version:1,implementationSha:process.env.GITHUB_SHA,tarballSha256,corpusManifestSha256:manifestSha256,tuples:Object.fromEntries(tuples.map(tuple=>[tuple,{binarySha256:ledger.artifacts[tuple].binarySha256,reportSha256:ledger.artifacts[tuple].auditReportSha256,implementationSha:process.env.GITHUB_SHA,reports:ledger.installed[tuple]}]))},null,2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-native-admission
          path: |
            admission.json
            identity-cleanup-ledger.json
          if-no-files-found: error

  benchmark-linux:
    name: benchmark-linux-node${{ matrix.node }}
    needs: [assemble-exact-native, classify]
    if: ${{ !cancelled() && (needs.classify.outputs.scope == 'linux' || needs.assemble-exact-native.result == 'success') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Record scope-skipped leg
        if: ${{ needs.classify.outputs.scope == 'linux' }}
        run: echo "scope=linux - this change cannot affect the native matrix; leg intentionally empty (docs/ci-budget.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          ref: "${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          ref: 411fdbdad3faa2e5dd5033bea5def435b4d03323
          path: .benchmark-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          name: admitted-native-tarball
          path: admitted
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        with:
          node-version: ${{ matrix.node }}
      - name: Pack immutable v0.1.1 baseline
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        working-directory: .benchmark-baseline
        run: npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE"
      - name: Run paired fresh-child benchmark
        if: ${{ needs.classify.outputs.scope != 'linux' }}
        env:
          BENCHMARK_MODE: ${{ github.event_name == 'pull_request' && 'report' || 'admit' }}
        shell: bash
        run: |
          baseline="$(find . -maxdepth 1 -name 'exifcleaner-node-0.1.1.tgz' -print -quit)"
          candidate="$(find admitted -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$baseline" && test -n "$candidate"
          npm run benchmark:qualify -- --baseline-tarball "$baseline" --candidate-tarball "$candidate" --mode "$BENCHMARK_MODE" --output "benchmark-node${{ matrix.node }}.json"
          node scripts/qualification/benchmark-report.cjs --validate-report "benchmark-node${{ matrix.node }}.json"
          node -e "const fs=require('node:fs');const report=JSON.parse(fs.readFileSync('benchmark-node${{ matrix.node }}.json','utf8'));if(report.version!==4||report.warmups!==2||report.measurements!==100||report.elapsedP95Estimator?.retainedObservations!==100||report.collection?.retries!==0||report.collection?.discarded!==0)throw new Error('fresh benchmark report contract is incomplete')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.classify.outputs.scope != 'linux'
        with:
          name: benchmark-linux-node${{ matrix.node }}
          path: |
            benchmark-node${{ matrix.node }}.json
            benchmark-node${{ matrix.node }}.json.md
          if-no-files-found: error

  phase-46-admission:
    if: ${{ always() && github.event_name != 'pull_request' && needs.classify.outputs.scope != 'linux' }}
    needs:
      - classify
      - quality
      - qualification-linux
      - immutable-sha-evidence
      - benchmark-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-native-admission
          path: final-native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-linux-x64-node24
          path: focused
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-linux-node*
          path: benchmarks
          merge-multiple: false
      - name: Admit the complete Phase 46 evidence graph
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'); const path=require('node:path'); const {CANONICAL_NATIVE_TUPLES:tuples,validateExactNativeManifestTuples}=require('./scripts/release_workflow_gate.cjs'); const {validateInstalledReport,validateIdentityCleanupLedger}=require('./scripts/qualification/benchmark-report.cjs'); const sha=value=>typeof value==='string'&&/^[0-9a-f]{64}$/.test(value);
          const needs=JSON.parse(process.env.NEEDS_JSON); if(Object.values(needs).some(value=>value.result!=='success')) throw new Error('an upstream Phase 46 authority did not pass');
          const ledger=JSON.parse(fs.readFileSync('final-native/identity-cleanup-ledger.json','utf8')); validateIdentityCleanupLedger(ledger); if(ledger.run?.headSha!==process.env.GITHUB_SHA||String(ledger.run?.id)!==String(process.env.GITHUB_RUN_ID))throw new Error('identity cleanup ledger is not bound to this run');
          const native=JSON.parse(fs.readFileSync('final-native/admission.json','utf8')); if(native.version!==1||!sha(native.tarballSha256)||!sha(native.corpusManifestSha256)||native.tuples===null||typeof native.tuples!=='object'||Array.isArray(native.tuples))throw new Error('installed admission envelope is incomplete'); if(native.implementationSha!==process.env.GITHUB_SHA)throw new Error('installed admission envelope is not bound to this run'); const producerTuples=Object.keys(native.tuples); const byTuple=validateExactNativeManifestTuples(producerTuples.map(tuple=>({tuple,value:native.tuples[tuple]}))); if(JSON.stringify(producerTuples)!==JSON.stringify(tuples))throw new Error('installed tuple traversal is not canonical'); const envelopeReportCount=Object.values(native.tuples).reduce((total,value)=>total+Object.keys(value?.reports??{}).length,0); if(envelopeReportCount!==2*tuples.length)throw new Error('installed evidence is incomplete'); const candidate={tarballSha256:native.tarballSha256,corpusManifestSha256:native.corpusManifestSha256}; const reports=[]; for(const [tuple,record] of byTuple){const item=record.value; if(!item||JSON.stringify(Object.keys(item.reports??{}).sort())!==JSON.stringify(['node22','node24']))throw new Error(`installed report map is incomplete for ${tuple}`); if(item.implementationSha!==process.env.GITHUB_SHA)throw new Error(`installed tuple implementation is not bound to this run for ${tuple}`); for(const [nodeMajor,key] of [[22,'node22'],[24,'node24']]){validateInstalledReport(item.reports[key],tuple,nodeMajor,candidate); reports.push(item.reports[key]);}} if(reports.length!==2*tuples.length)throw new Error('installed evidence is incomplete');
          const focused=JSON.parse(fs.readFileSync('focused/qualification-linux.json','utf8')); if(focused.version!==1||focused.tuple!=='linux-x64'||!/^v24\./.test(focused.nodeVersion??'')||focused.seed!==460046||focused.propertyRuns!==200||focused.manifestSha256!==native.corpusManifestSha256||focused.authority===null||typeof focused.authority!=='object'||Array.isArray(focused.authority)||Object.keys(focused.authority).length===0)throw new Error('focused hostile/oracle evidence is incomplete');
          const baselineSha256='c2fc569b553cba360814bcce61d6882a02aba062e6d6da2193323915530a34bf'; const expectedBenchmarkFiles=['benchmark-linux-node22/benchmark-node22.json','benchmark-linux-node22/benchmark-node22.json.md','benchmark-linux-node24/benchmark-node24.json','benchmark-linux-node24/benchmark-node24.json.md']; const actualBenchmarkFiles=fs.readdirSync('benchmarks',{recursive:true,withFileTypes:true}).filter(entry=>entry.isFile()).map(entry=>path.relative('benchmarks',path.join(entry.parentPath,entry.name)).replaceAll(path.sep,'/')).sort(); if(JSON.stringify(actualBenchmarkFiles)!==JSON.stringify(expectedBenchmarkFiles))throw new Error('benchmark artifact file set is not exact'); const files=['benchmark-linux-node22/benchmark-node22.json','benchmark-linux-node24/benchmark-node24.json']; const benchmarkReports=files.map(file=>JSON.parse(fs.readFileSync(path.join('benchmarks',file),'utf8'))); if(benchmarkReports.some(report=>report.version!==4||report.warmups!==2||report.measurements!==100||report.elapsedP95Estimator?.retainedObservations!==100||report.collection?.retries!==0||report.collection?.discarded!==0))throw new Error('fresh benchmark report contract is incomplete'); if(benchmarkReports.some((report,index)=>Number(report.environment?.nodeVersion?.match(/^v(\d+)/)?.[1])!==[22,24][index]))throw new Error('benchmark filename and Node authority disagree'); if(benchmarkReports.some(report=>!report.pass||report.mode!=='admit'||report.baselinePackageName!=='exifcleaner-node'||report.baselineVersion!=='0.1.1'||report.baselineExpectedIdentity!==`exifcleaner-node@0.1.1#sha256:${baselineSha256}`||report.baselineSha256!==baselineSha256||!sha(report.candidateSha256)||report.baselineSha256===report.candidateSha256||report.candidateSha256!==native.tarballSha256)) throw new Error('benchmark baseline identity or candidate binding is incomplete');
          require('node:child_process').execFileSync(process.execPath,['scripts/qualification/benchmark-report.cjs','--phase-admission',...files.map(file=>path.join('benchmarks',file))],{stdio:'inherit'});
          const majors=benchmarkReports.map(report=>Number(report.environment.nodeVersion.match(/^v(\d+)/)[1])).sort(); if(majors.join(',')!=='22,24') throw new Error('benchmark Node authorities are incomplete'); const baselineDigests=new Set(benchmarkReports.map(report=>report.baselineSha256)); const candidateDigests=new Set(benchmarkReports.map(report=>report.candidateSha256)); if(baselineDigests.size!==1||candidateDigests.size!==1) throw new Error('benchmark reports disagree on package digests');
          fs.writeFileSync('phase-46-admission.json',JSON.stringify({version:1,conclusion:'pass',implementationSha:process.env.GITHUB_SHA,tarballSha256:native.tarballSha256,manifestSha256:focused.manifestSha256,oracleAuthority:focused.authority,installedConclusions:reports.length,benchmarks:benchmarkReports.map(report=>({nodeVersion:report.environment.nodeVersion,reportVersion:report.version,retainedObservationCount:report.elapsedP95Estimator.retainedObservations,baselinePackageName:report.baselinePackageName,baselineVersion:report.baselineVersion,baselineExpectedIdentity:report.baselineExpectedIdentity,baselineSha256:report.baselineSha256,candidateSha256:report.candidateSha256,conclusion:'pass'}))},null,2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-46-admission
          path: phase-46-admission.json
          if-no-files-found: error
